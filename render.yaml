# Render deployment configuration for CommuniQ.
#
# Two services:
#   1. communiq-ai-server  — Python / FastAPI (Groq STT + LLM, Edge TTS)
#   2. communiq-server     — Node.js / Express (REST API + Firestore)
#
# Not deployed here: pipecat-worker + LiveKit (optional live-voice mode).
# The worker runs Whisper/Kokoro/an LLM locally and needs a GPU host, so
# production uses the classic HTTP turn mode (LIVEKIT_ENABLED=false). See
# docs/RELEASE.md → "Live voice" to enable it on your own infrastructure.
#
# Plans: `free` instances sleep after ~15 minutes idle, so the first request
# takes up to a minute and the Node background jobs (stale-session cleanup,
# evaluation-model retraining) pause while asleep. Use at least `starter` for
# a public launch.
#
# Secrets marked `sync: false` must be filled in on the Render dashboard
# (Environment tab) — the services refuse to start in production without them:
#   - GROQ_API_KEY                         (ai-server)
#   - AI_SERVER_INTERNAL_KEY               (BOTH services, identical value)
#   - ALLOWED_ORIGINS                      (ai-server: the Node URL)
#   - FIREBASE_PROJECT_ID / FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY
#   - ADMIN_SECRET                         (generated below if left empty)
#   - PIPECAT_WEBHOOK_SECRET               (generated below)

services:
  # ── AI server (FastAPI) ───────────────────────────────────────────────────────
  - type: web
    name: communiq-ai-server
    runtime: python
    rootDir: ai-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      # Turns on the startup checks for AI_SERVER_INTERNAL_KEY and
      # ALLOWED_ORIGINS. Without it the server runs in development mode and
      # accepts unauthenticated calls.
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      # Grading model. qwen/qwen3.8-27b runs out of tokens mid-JSON on the
      # evaluator prompts, which surfaces in the app as a 503 on "Submit".
      - key: EVAL_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: AI_SERVER_INTERNAL_KEY
        sync: false   # EXACT same value as on communiq-server
      - key: ALLOWED_ORIGINS
        sync: false   # the Node backend's URL, e.g. https://communiq.onrender.com
                      # (server-to-server only; must not be '*')

  # ── Node.js backend ───────────────────────────────────────────────────────────
  - type: web
    name: communiq-server
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Public HTTPS URL of the AI server. A `fromService … property: host`
      # reference resolves to the private-network hostname, which free
      # instances can't receive traffic on — so this is set explicitly.
      # Change it if your AI service has a different URL.
      - key: FASTAPI_URL
        value: https://communiq-ai-server.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false   # paste the full -----BEGIN PRIVATE KEY----- block
      - key: ADMIN_SECRET
        generateValue: true
      - key: AI_SERVER_INTERNAL_KEY
        sync: false   # EXACT same value as on communiq-ai-server
      # Required at boot in production (src/config/validateSecrets.js) even
      # with live voice off — a missing value stops the server from starting.
      - key: PIPECAT_WEBHOOK_SECRET
        generateValue: true
      - key: LIVEKIT_ENABLED
        value: "false"
      # The mobile apps send no Origin header, so this only matters for
      # browsers. Leave empty to block all browser origins in production.
      - key: ALLOWED_ORIGINS
        sync: false
