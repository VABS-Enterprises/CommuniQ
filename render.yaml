# Render deployment configuration for CommuniQ.
#
# Two services are defined here:
#   1. communiq-ai-server  — Python / FastAPI (Groq STT + LLM + TTS)
#   2. communiq-server     — Node.js / Express (REST API + Firestore)
#
# Deploy order matters: deploy the AI server first so you can copy its URL
# into FASTAPI_URL on the Node server (Render sets this automatically when
# using the `fromService` reference below).
#
# After your first deploy:
#   1. Open the Render dashboard for communiq-server.
#   2. Confirm FASTAPI_URL is set to https://communiq-ai-server.onrender.com
#      (Render resolves the fromService reference at deploy time).
#   3. Add every secret marked sync: false in the dashboard Environment tab.
#
# Required dashboard secrets (all marked sync: false below — Render will not
# set these for you, and the services will run insecurely or fail to start
# until they are filled in):
#   - AI_SERVER_INTERNAL_KEY  (communiq-ai-server AND communiq-server — same
#     value on both; this is the shared server-to-server auth secret between
#     the Node backend and the AI server)
#   - ALLOWED_ORIGINS         (communiq-ai-server AND communiq-server — see
#     the per-service comments below for what each should be set to)

services:
  # ── AI server (FastAPI) ───────────────────────────────────────────────────────
  - type: web
    name: communiq-ai-server
    runtime: python
    rootDir: ai-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false   # paste your Groq API key in the Render dashboard
      - key: AI_SERVER_INTERNAL_KEY
        sync: false   # shared secret with communiq-server — must be the EXACT
                       # same value as AI_SERVER_INTERNAL_KEY on communiq-server
                       # below. Without this set on both services, the AI
                       # server is effectively unauthenticated in production.
      - key: ALLOWED_ORIGINS
        sync: false   # set to the Node backend's URL only, e.g.
                       # https://communiq-server.onrender.com — this server is
                       # only ever called server-to-server, never from a
                       # browser, so it should not accept arbitrary origins

  # ── Node.js backend ───────────────────────────────────────────────────────────
  - type: web
    name: communiq-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: FASTAPI_URL
        fromService:
          type: web
          name: communiq-ai-server
          property: host
          # Render sets this to the HTTPS URL of communiq-ai-server automatically.
          # Format: https://communiq-ai-server.onrender.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false   # paste the full -----BEGIN PRIVATE KEY----- block
      - key: ADMIN_SECRET
        sync: false
      - key: AI_SERVER_INTERNAL_KEY
        sync: false   # shared secret with communiq-ai-server — must be the
                       # EXACT same value as AI_SERVER_INTERNAL_KEY on
                       # communiq-ai-server above.
      - key: ALLOWED_ORIGINS
        sync: false   # MUST be set explicitly in the Render dashboard to the
                       # actual production frontend origin(s), comma-separated
                       # (e.g. https://app.communiq.in) — never '*' in
                       # production, that allows any site to call this API
