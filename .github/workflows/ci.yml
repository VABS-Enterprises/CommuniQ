name: CI

on:
  push:
    branches: [main, version-one]
  pull_request:

jobs:
  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
      - run: flutter pub get
      # Infos (deprecations) are allowed; warnings and errors fail the build.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  server:
    name: Node server — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      # The server ships its own copy of the curriculum; fail if it drifted
      # from the authored file at the repo root.
      - run: npm run levels:check

  ai-server:
    name: AI server — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-server/requirements.txt
      - run: pip install -r requirements-dev.txt
      # test_groq.py calls the live Groq API and needs a key; skip it in CI.
      - run: python -m pytest -q --ignore=tests/test_groq.py
