version: "3.8"

# CommuniQ — LiveKit server (LOCAL DEV — this is the dev compose file)
#
# See docker-compose.prod.yml alongside this file for the production
# variant (TLS enabled, cert paths supplied via env/volume mount). Do not
# deploy this file as-is — it disables TLS and uses dev-only credentials.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# Verify running: curl http://localhost:7880
#
# On a laptop (dev): livekit.yaml has use_external_ip: false
# On a VPS (prod):   use docker-compose.prod.yml + set use_external_ip: true
#                     in livekit.yaml + update turn.domain

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml
    restart: unless-stopped
    ports:
      # WebRTC signaling + HTTP API
      - "7880:7880"
      # WebRTC signaling over TLS
      - "7881:7881"
      # TURN relay (UDP) — relay for phones behind strict NAT
      - "3478:3478/udp"
      # TURN/TLS (5349) omitted in dev — requires certs in livekit.yaml
      # WebRTC media UDP range — must match livekit.yaml port_range_start/end
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
